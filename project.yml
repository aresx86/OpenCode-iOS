name: OpenCode
options:
  bundleIdPrefix: com.aresx86
  deploymentTarget:
    iOS: "16.1"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  OpenCode:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "2000000"
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: OpenCode
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSMicrophoneUsageDescription: 语音输入需要使用麦克风
        NSSpeechRecognitionUsageDescription: 语音输入需要使用语音识别
        ITSAppUsesNonExemptEncryption: false
schemes:
  OpenCode:
    build:
      targets:
        OpenCode: all
    run:
      config: Debug
